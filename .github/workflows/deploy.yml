name: Deploy

# Runs after a push lands on main. Rely on branch protection (require the
# Test and Lint workflows to pass before merge) so nothing broken reaches
# main in the first place, rather than re-running checks here.
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: build frontend, open SSH, deploy both, close SSH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find this runner's IP
        run: echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> "$GITHUB_ENV"

      - name: Open SSH to this runner's IP only
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32

      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: rsync build output to the server
        run: |
          rsync -avz --delete \
            frontend/build/ ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/var/www/realiti/

      - name: SSH in, pull, rebuild, migrate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Realiti
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend \
              poetry run flask db upgrade

      # Runs even if an earlier step failed, so a broken deploy never leaves
      # port 22 open to this runner's IP indefinitely.
      - name: Close SSH again
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32
