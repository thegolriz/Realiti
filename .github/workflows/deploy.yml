name: Deploy

# Runs after a push lands on main. Rely on branch protection (require the
# Test and Lint workflows to pass before merge) so nothing broken reaches
# main in the first place, rather than re-running checks here.
on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: deploy backend (docker + migrations)
    runs-on: ubuntu-latest
    steps:
      - name: SSH in, pull, rebuild, migrate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Realiti
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend \
              poetry run flask db upgrade

  deploy-frontend:
    name: build + rsync frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: rsync build output to the server
        run: |
          rsync -avz --delete \
            frontend/build/ ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/var/www/realiti/
